name: build-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# 发 Release 需要写权限（默认 GITHUB_TOKEN 是只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android commandline-tools
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform / build-tools
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Prepare tool dir (T)
        run: |
          set -eux
          BT_DIR="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          PLAT_DIR="$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$BT_DIR/aapt2"         || { echo "::error::missing aapt2";  ls "$BT_DIR"; exit 1; }
          test -f "$BT_DIR/lib/d8.jar"    || { echo "::error::missing d8.jar"; ls "$BT_DIR/lib"; exit 1; }
          test -f "$PLAT_DIR/android.jar" || { echo "::error::missing android.jar"; exit 1; }

          T="$RUNNER_TEMP/tools"
          mkdir -p "$T/plat"
          ln -sfn "$JAVA_HOME" "$T/jdk"
          ln -sfn "$BT_DIR" "$T/bt"
          cp "$PLAT_DIR/android.jar" "$T/plat/android.jar"
          echo "T=$T" >> "$GITHUB_ENV"

      - name: Restore keystore (optional)
        env:
          KS_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FACET_KEYSTORE_PASS }}
        run: |
          mkdir -p "$HOME/.facet"
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$HOME/.facet/facet.keystore"
            printf '%s' "$KS_PASS" > "$HOME/.facet/keystore.pass"
            echo "使用仓库 Secrets 里的固定签名"
          else
            echo "::warning::未配置 FACET_KEYSTORE_B64，本次使用临时签名（每次不同，装机前需卸载旧版）"
          fi

      - name: python alias
        run: |
          if ! command -v python >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python -c "import zipfile; print('python ok')"

      - name: Build
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Rename APK
        id: apk
        run: |
          set -eux
          NAME="Facet-debug-${GITHUB_SHA::7}.apk"
          cp dist/Facet.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$NAME"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore

      # ci-build 分支推送时自动发 pre-release（公开直链，不需要登录）
      - name: Publish pre-release
        if: github.ref == 'refs/heads/ci-build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="debug-$(date -u +%Y%m%d-%H%M%S)"
          ASSET="${{ steps.apk.outputs.name }}"
          gh release create "$TAG" "$ASSET" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ${TAG}" \
            --notes "auto debug build | commit ${GITHUB_SHA} | temp signature, uninstall old Facet first"

      - name: Summary
        run: |
          echo "## 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist/Facet.apk >> "$GITHUB_STEP_SUMMARY"