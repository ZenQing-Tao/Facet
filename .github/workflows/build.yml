name: build-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Diagnose SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || echo "sdkmanager NOT on PATH"
          sdkmanager --version || true
          echo "--- sdk dir ---"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Install platform / build-tools
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager --list_installed || true

      - name: Prepare tool dir (T)
        run: |
          set -e
          BT_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          PLAT_DIR=$(ls -d "$ANDROID_HOME"/platforms/* 2>/dev/null | sort -V | tail -1)
          echo "BT_DIR=$BT_DIR"
          echo "PLAT_DIR=$PLAT_DIR"
          if [ -z "$BT_DIR" ] || [ -z "$PLAT_DIR" ]; then
            echo "::error::build-tools 或 platforms 没装上，看上一步日志"
            exit 1
          fi
          test -f "$PLAT_DIR/android.jar" || { echo "::error::缺少 android.jar（$PLAT_DIR）"; exit 1; }
          test -x "$BT_DIR/aapt2" || { echo "::error::缺少 aapt2（$BT_DIR）"; ls "$BT_DIR"; exit 1; }
          test -f "$BT_DIR/lib/d8.jar" || { echo "::error::缺少 d8.jar（$BT_DIR/lib）"; ls "$BT_DIR/lib"; exit 1; }

          T="$RUNNER_TEMP/tools"
          mkdir -p "$T/plat"
          ln -sfn "$JAVA_HOME" "$T/jdk"
          ln -sfn "$BT_DIR" "$T/bt"
          cp "$PLAT_DIR/android.jar" "$T/plat/android.jar"
          echo "T=$T" >> "$GITHUB_ENV"
          ls -l "$T" "$T/bt" | head -30

      - name: Restore keystore (optional)
        env:
          KS_B64: ${{ secrets.FACET_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FACET_KEYSTORE_PASS }}
        run: |
          mkdir -p "$HOME/.facet"
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$HOME/.facet/facet.keystore"
            printf '%s' "$KS_PASS" > "$HOME/.facet/keystore.pass"
            echo "使用仓库 Secrets 里的固定签名"
          else
            echo "::warning::未配置 FACET_KEYSTORE_B64，本次构建使用临时签名（每次不同，装机前需卸载旧版）"
          fi

      - name: python alias
        run: |
          if ! command -v python >/dev/null; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python -c "import zipfile; print('python ok')"

      - name: Build
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Facet-apk-${{ github.sha }}
          path: dist/Facet.apk
          if-no-files-found: error
          retention-days: 14